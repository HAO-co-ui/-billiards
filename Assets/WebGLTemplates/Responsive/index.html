<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>Idea35 Pool Room</title>
  <style>
    /* **真自适应模板**：画布永远铺满可视区（默认模板在"桌面样式"下写死 1280×720 ⇒ 小窗口/平板会被裁）。 */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #231F20; overflow: hidden; }
    #unity-container { position: fixed; inset: 0; width: 100%; height: 100%; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #231F20; }
    #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; }
    /* 加载页台球 Logo（项目内生成的 8 号球图，随模板一起打包）。 */
    #unity-logo { width: 132px; height: 132px; margin: 0 auto 18px auto;
      background: url('logo.png') center / contain no-repeat; }
    #unity-progress-bar-empty { width: 240px; height: 10px; border-radius: 5px; background: #3A3436; overflow: hidden; }
    #unity-progress-bar-full { width: 0%; height: 10px; border-radius: 5px; background: #C9A227; }
    #unity-warning { position: absolute; left: 50%; top: 5%; transform: translate(-50%);
      background: white; padding: 10px; display: none; }
    /* 启动失败面板：可读、可滚动、可重载（替代原生 alert）。 */
    #startup-error { display: none; position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%); width: min(560px, 90vw); max-height: 70vh; overflow: auto;
      background: rgba(24,26,30,.97); border: 1px solid rgba(201,162,39,.5); border-radius: 12px;
      padding: 16px 18px; color: #EDE7DA; font: 13px/1.5 Arial, sans-serif; z-index: 20; }
    #startup-error h4 { margin: 0 0 8px; color: #D4AF37; font-size: 14px; letter-spacing: .06em; }
    #startup-error pre { white-space: pre-wrap; word-break: break-word; margin: 0 0 12px; }
    #startup-error button { padding: 8px 16px; border-radius: 8px; border: 1px solid #D4AF37;
      background: transparent; color: #D4AF37; font-size: 13px; }
    /* 云排行榜（右上角）：不遮挡 Unity 画布主体，只在需要时展开。 */
    /* RANK 移到**右下角**：原来贴右上角，和游戏内右上那一排图标按钮打架（实机截图圈出重叠）。 */
    #rank-toggle { position: absolute; right: 14px; bottom: 18px; z-index: 10;
      padding: 8px 14px; border-radius: 10px; border: 1px solid rgba(201,162,39,.55);
      background: rgba(20,22,26,.78); color: #E8D9A8; font: 600 13px/1 Arial, sans-serif;
      letter-spacing: .08em; cursor: pointer; user-select: none; }
    #rank-panel { position: absolute; right: 14px; bottom: 64px; z-index: 10; width: 260px;
      max-height: 60vh; overflow: auto; display: none; padding: 12px 14px;
      border-radius: 12px; border: 1px solid rgba(201,162,39,.45);
      background: rgba(18,20,24,.92); color: #EDE7DA; font: 12px/1.5 Arial, sans-serif; }
    #rank-panel h3 { margin: 0 0 8px 0; font-size: 12px; letter-spacing: .14em;
      color: #C9A227; text-transform: uppercase; }
    #rank-panel ol { margin: 0; padding-left: 18px; }
    #rank-panel li { margin: 3px 0; }
    #rank-panel .muted { color: #8C8C8C; }
  </style>
</head>
<body>
  <div id="unity-container">
    <div id="rank-toggle">RANK</div>
    <div id="rank-panel"><h3>Leaderboard</h3><ol id="rank-list"></ol></div>

    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    </div>
    <div id="unity-warning"></div>
    <div id="startup-error">
      <h4>Failed to start</h4>
      <pre id="startup-error-text"></pre>
      <button onclick="location.reload()">Reload</button>
    </div>
  </div>

  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      warningBanner.appendChild(div);
      if (type == 'error') div.style.cssText = 'background: red; padding: 10px;';
      else { if (type == 'warning') div.style.cssText = 'background: yellow; padding: 10px;';
             setTimeout(function() { warningBanner.removeChild(div); updateBannerVisibility(); }, 5000); }
      updateBannerVisibility();
    }

    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: unityShowBanner,
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      container.className = "unity-mobile";
      canvas.className = "unity-mobile";
    }

    loadingBar.style.display = "block";

    createUnityInstance(canvas, config, (progress) => {
      progressBarFull.style.width = 100 * progress + "%";
    }).then((unityInstance) => {
      loadingBar.style.display = "none";
    }).catch((message) => {
      // **不弹原生 alert**（移动端会盖住整页且信息难读）。改为页内面板，带重载按钮。
      showStartupError(String(message));
    });

    function showStartupError(text) {
      var box = document.getElementById('startup-error');
      var msg = document.getElementById('startup-error-text');
      if (!box || !msg) { console.error('[startup]', text); return; }
      msg.textContent = text;
      box.style.display = 'block';
    }

    window.addEventListener('error', function (e) {
      if (e && e.message) showStartupError(e.message);
    });
  </script>

  <!-- 云服务 SDK（CDN 形式）。⚠ **必须 async**：同步 script 在网络不通时会把整页卡在加载阶段，
       实测 jsdelivr 被重置时页面永远停在进度条 ⇒ 排行榜可选，不能挡住游戏本体。 -->
  <script id="pool-cloud-sdk" async
          src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
  <script>
    // ── 云服务：练习成绩排行榜 ────────────────────────────────────────────────
    // publicConfig 由开通云服务时下发（endpoint / oauthRelayBaseUrl / publishableKey）。
    // ⚠ 这里**不含任何密钥**：publishableKey 只标识应用，服务端按 Origin 校验。
    (function () {
      const publicConfig = {
        endpoint: "https://poolroom-8ball.app.workbuddy.host",
        oauthRelayBaseUrl: "https://www.workbuddy.cn/v2/as/genie-baas/oauth",
        publishableKey: "wbpk_bhMulmulphMH5feihXQZiM_oSp1wc7FWsV00fZrQCx3CPBUFi49Xshi"
      };

      const listEl = document.getElementById('rank-list');
      const panelEl = document.getElementById('rank-panel');
      const toggleEl = document.getElementById('rank-toggle');
      let cloud = null;

      function setList(rows) {
        listEl.innerHTML = '';
        if (!rows || !rows.length) {
          const li = document.createElement('li');
          li.className = 'muted';
          li.textContent = '暂无记录 —— 打完一局练习就会出现在这里';
          listEl.appendChild(li);
          return;
        }
        rows.forEach(function (r) {
          const li = document.createElement('li');
          li.textContent = (r.player_name || 'Guest') + ' · ' + r.potted + ' 进袋 / ' +
            r.shots + ' 杆' + (r.fouls ? ' · ' + r.fouls + ' 犯规' : '');
          listEl.appendChild(li);
        });
      }

      async function refresh() {
        if (!cloud) return;
        const { data, error } = await cloud.database.from('practice_scores')
          .select('player_name, shots, potted, fouls, created_at')
          .order('potted', { ascending: false })
          .order('shots', { ascending: true })
          .limit(8);
        if (error) { console.warn('[PoolCloud] read failed', error); setList(null); return; }
        setList(data);
      }

      async function submitScore(shots, potted, fouls, cleared) {
        if (!cloud) return;
        const name = 'Guest-' + Math.random().toString(36).slice(2, 6).toUpperCase();
        const { error } = await cloud.database.from('practice_scores').insert({
          player_name: name,
          shots: shots, potted: potted, fouls: fouls,
          outcome: cleared ? 'cleared' : 'ended'
        });
        if (error) { console.warn('[PoolCloud] insert failed', error); return; }
        await refresh();
      }

      window.PoolCloud = { submitScore: submitScore, refresh: refresh };

      toggleEl.addEventListener('click', function () {
        const open = panelEl.style.display === 'block';
        panelEl.style.display = open ? 'none' : 'block';
        if (!open) refresh();
      });

      // **SDK 就绪再初始化**（async 加载可能晚于本脚本执行）：最多等 10 秒，超时只关排行榜。
      function initWhenReady(deadline) {
        if (window.WorkBuddyCloud && window.WorkBuddyCloud.createWorkBuddyCloud) {
          initCloud();
          return;
        }
        if (Date.now() > deadline) {
          console.warn('[PoolCloud] SDK 未就绪，排行榜关闭（不影响游戏）');
          return;
        }
        setTimeout(function () { initWhenReady(deadline); }, 400);
      }

      function initCloud() {
        try {
          {
            cloud = window.WorkBuddyCloud.createWorkBuddyCloud({
              endpoint: publicConfig.endpoint,
              oauthRelayBaseUrl: publicConfig.oauthRelayBaseUrl,
              publishableKey: publicConfig.publishableKey
            });
            refresh();
          }
        } catch (e) {
          console.warn('[PoolCloud] init failed', e);
        }
      }

      initWhenReady(Date.now() + 10000);
    })();
  </script>
</body>
</html>
